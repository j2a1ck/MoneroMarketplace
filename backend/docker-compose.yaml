services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-marketplace-backend

    ports:
      - "3000:3000"

    env_file:
      - .env.docker

    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    container_name: postgres_cryptoMarketPlace
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: postgres_data_volume
